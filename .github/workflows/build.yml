name: Build and Release NeoMDIE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NeoMDIE x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile NeoMDIE
        shell: cmd
        run: |
          build.bat release

      - name: Prepare Release Package
        id: pkg
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") {
              $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
              "v1.1.0"
          }
          $pkgName = "NeoMDIE-$ver-windows-x64"
          $pkgDir = "release_pkg\$pkgName"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          
          # Copy executable and supporting files
          Copy-Item -Path "bin\NeoMDIE.exe" -Destination "$pkgDir\"
          if (Test-Path "scripts") {
              Copy-Item -Path "scripts" -Destination "$pkgDir\scripts" -Recurse
          }
          if (Test-Path "bin\scripts") {
              New-Item -ItemType Directory -Force -Path "$pkgDir\scripts" | Out-Null
              Copy-Item -Path "bin\scripts\*" -Destination "$pkgDir\scripts\" -Recurse -Force
          }
          if (Test-Path "bin\restore_explorer.bat") {
              Copy-Item -Path "bin\restore_explorer.bat" -Destination "$pkgDir\"
          }
          if (Test-Path "bin\restore_explorer.reg") {
              Copy-Item -Path "bin\restore_explorer.reg" -Destination "$pkgDir\"
          }
          if (Test-Path "README.md") {
              Copy-Item -Path "README.md" -Destination "$pkgDir\"
          }
          if (Test-Path "RELEASE_NOTES.md") {
              Copy-Item -Path "RELEASE_NOTES.md" -Destination "$pkgDir\"
          }
          if (Test-Path "LICENSE") {
              Copy-Item -Path "LICENSE" -Destination "$pkgDir\"
          }

          Compress-Archive -Path "$pkgDir\*" -DestinationPath "release_pkg\$pkgName.zip" -Force
          Get-FileHash -Algorithm SHA256 "release_pkg\$pkgName.zip" | Out-File -FilePath "release_pkg\$pkgName.zip.sha256" -Encoding utf8

          "package_path=release_pkg/$pkgName.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha=release_pkg/$pkgName.zip.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoMDIE-Windows-x64
          path: |
            bin/NeoMDIE.exe
            release_pkg/*.zip
            release_pkg/*.sha256

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_pkg/*.zip
            release_pkg/*.sha256
            bin/NeoMDIE.exe
          tag_name: ${{ steps.pkg.outputs.release_tag }}
          name: NeoMDIE ${{ steps.pkg.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
